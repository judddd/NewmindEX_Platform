services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.17.3}
    container_name: es01
    restart: unless-stopped
    environment:
      - node.name=es01
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es02,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_MEM:-31g} -Xmx${ES_MEM:-31g}"
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-false}
      - xpack.ml.enabled=${ES_ML_ENABLED:-true}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT_1:-9200}:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.17.3}
    container_name: es02
    restart: unless-stopped
    environment:
      - node.name=es02
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_MEM:-31g} -Xmx${ES_MEM:-31g}"
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-false}
      - xpack.ml.enabled=${ES_ML_ENABLED:-true}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata02:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT_2:-9201}:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.17.3}
    container_name: es03
    restart: unless-stopped
    environment:
      - node.name=es03
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es02
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_MEM:-31g} -Xmx${ES_MEM:-31g}"
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-false}
      - xpack.ml.enabled=${ES_ML_ENABLED:-true}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata03:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT_3:-9202}:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION:-8.17.3}
    container_name: kibana
    restart: unless-stopped
    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./kibana/branding:/usr/share/kibana/branding:ro
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60

  logstash:
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION:-8.17.3}
    container_name: logstash
    restart: unless-stopped
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
      - "${LOGSTASH_API_PORT:-9600}:9600"
    networks:
      - elastic

  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    container_name: minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:${MINIO_CONSOLE_PORT:-9001}
    command: server /data --console-address ":9001"
    volumes:
      - ${MINIO_DATA_DIR:-./minio_data}:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - elastic
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Documentation Services
  newflow_docs:
    image: newflow-docs:1.0
    container_name: newflow_docs
    restart: unless-stopped
    ports:
      - "${NEWFLOW_DOCS_PORT:-8001}:8001"
    networks:
      - elastic

  newchat_docs:
    image: newchat-docs:1.0.1
    container_name: newchat_docs
    restart: unless-stopped
    ports:
      - "${NEWCHAT_DOCS_PORT:-8002}:8002"
    networks:
      - elastic

volumes:
  esdata01:
    driver: local
  esdata02:
    driver: local
  esdata03:
    driver: local

networks:
  elastic:
    driver: bridge
