version: '3.8'

services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.17.3}
    container_name: es01
    restart: unless-stopped
    environment:
      - node.name=es01
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es02,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_MEM:-31g} -Xmx${ES_MEM:-31g}"
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-false}
      - xpack.ml.enabled=${ES_ML_ENABLED:-true}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT_1:-9200}:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.17.3}
    container_name: es02
    restart: unless-stopped
    environment:
      - node.name=es02
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_MEM:-31g} -Xmx${ES_MEM:-31g}"
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-false}
      - xpack.ml.enabled=${ES_ML_ENABLED:-true}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata02:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT_2:-9201}:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.17.3}
    container_name: es03
    restart: unless-stopped
    environment:
      - node.name=es03
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es02
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_MEM:-31g} -Xmx${ES_MEM:-31g}"
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-false}
      - xpack.ml.enabled=${ES_ML_ENABLED:-true}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata03:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT_3:-9202}:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION:-8.17.3}
    container_name: kibana
    restart: unless-stopped
    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./kibana/branding:/usr/share/kibana/branding:ro
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60

  logstash:
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION:-8.17.3}
    container_name: logstash
    restart: unless-stopped
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
      - "${LOGSTASH_API_PORT:-9600}:9600"
    networks:
      - elastic

  newflow:
    image: newflow:${NEWFLOW_VERSION:-1.0.4}
    container_name: newflow
    restart: unless-stopped
    ports:
      - "${NEWFLOW_PORT:-5677}:5677"
    environment:
      # 基础配置
      - NEWFLOW_PORT=${NEWFLOW_PORT:-5677}
      - N8N_PORT=${NEWFLOW_PORT:-5677}
      - NEWFLOW_LISTEN_ADDRESS=${NEWFLOW_LISTEN_ADDRESS:-0.0.0.0}
      - N8N_LISTEN_ADDRESS=${NEWFLOW_LISTEN_ADDRESS:-0.0.0.0}
      
      # 自动初始化
      - NEWFLOW_AUTO_SETUP_ENABLED=${NEWFLOW_AUTO_SETUP_ENABLED:-false}
      - NEWFLOW_AUTO_SETUP_EMAIL=${NEWFLOW_AUTO_SETUP_EMAIL:-admin@localhost.com}
      - NEWFLOW_AUTO_SETUP_PASSWORD=${NEWFLOW_AUTO_SETUP_PASSWORD:-admin123A}
      - NEWFLOW_PREDEFINED_API_KEY=${NEWFLOW_PREDEFINED_API_KEY}
      
      # AI 集成
      - CUSTOM_AI_BASE_URL=${NEWFLOW_CUSTOM_AI_BASE_URL}
      - CUSTOM_AI_API_KEY=${NEWFLOW_CUSTOM_AI_API_KEY}
      - CUSTOM_AI_MODEL=${NEWFLOW_CUSTOM_AI_MODEL}
      
      # 高级配置（同时设置 NEWFLOW_ 和 N8N_ 前缀以兼容）
      - DB_SQLITE_POOL_SIZE=${DB_SQLITE_POOL_SIZE:-5}
      - NEWFLOW_RUNNERS_ENABLED=${NEWFLOW_RUNNERS_ENABLED:-true}
      - N8N_RUNNERS_ENABLED=${NEWFLOW_RUNNERS_ENABLED:-true}
      - NEWFLOW_BLOCK_ENV_ACCESS_IN_NODE=${NEWFLOW_BLOCK_ENV_ACCESS_IN_NODE:-false}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${NEWFLOW_BLOCK_ENV_ACCESS_IN_NODE:-false}
      - NEWFLOW_GIT_NODE_DISABLE_BARE_REPOS=${NEWFLOW_GIT_NODE_DISABLE_BARE_REPOS:-true}
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=${NEWFLOW_GIT_NODE_DISABLE_BARE_REPOS:-true}
      - NEWFLOW_SECURE_COOKIE=${NEWFLOW_SECURE_COOKIE:-false}
      - N8N_SECURE_COOKIE=${NEWFLOW_SECURE_COOKIE:-false}
      
      # 文件权限强制执行
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - ./newflow_data:/home/node/.newflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - elastic

volumes:
  esdata01:
    driver: local
  esdata02:
    driver: local
  esdata03:
    driver: local

networks:
  elastic:
    driver: bridge
