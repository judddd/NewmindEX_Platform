version: '3.8'

services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: es01
    environment:
      - node.name=es01
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es02,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms31g -Xmx31g"
      - xpack.security.enabled=false
      - xpack.ml.enabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: es02
    environment:
      - node.name=es02
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es03
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms31g -Xmx31g"
      - xpack.security.enabled=false
      - xpack.ml.enabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata02:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
    networks:
      - elastic

  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: es03
    environment:
      - node.name=es03
      - cluster.name=${ES_CLUSTER_NAME:-es-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es02
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms31g -Xmx31g"
      - xpack.security.enabled=false
      - xpack.ml.enabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata03:/usr/share/elasticsearch/data
    ports:
      - "9202:9200"
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: kibana
    depends_on:
      - es01
      - es02
      - es03
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./kibana/branding:/usr/share/kibana/branding:ro
    networks:
      - elastic

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    container_name: logstash
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
      - "9600:9600"
    networks:
      - elastic

  newflow:
    image: newflow:1.0.0
    container_name: newflow
    ports:
      - "${NEWFLOW_PORT:-5677}:5677"
    environment:
      - N8N_PORT=${NEWFLOW_PORT:-5677}
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_AUTO_SETUP_ENABLED=${NEWFLOW_AUTO_SETUP_ENABLED:-true}
      - N8N_AUTO_SETUP_EMAIL=${NEWFLOW_AUTO_SETUP_EMAIL:-admin@localhost.com}
      - N8N_AUTO_SETUP_PASSWORD=${NEWFLOW_AUTO_SETUP_PASSWORD:-admin123A}
      - N8N_PREDEFINED_API_KEY=${NEWFLOW_PREDEFINED_API_KEY}
      - CUSTOM_AI_BASE_URL=${NEWFLOW_CUSTOM_AI_BASE_URL}
      - CUSTOM_AI_API_KEY=${NEWFLOW_CUSTOM_AI_API_KEY}
      - CUSTOM_AI_MODEL=${NEWFLOW_CUSTOM_AI_MODEL}
      - DB_SQLITE_POOL_SIZE=5
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
    volumes:
      - ./newflow_data:/home/node/.newflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - elastic

volumes:
  esdata01:
    driver: local
  esdata02:
    driver: local
  esdata03:
    driver: local

networks:
  elastic:
    driver: bridge
