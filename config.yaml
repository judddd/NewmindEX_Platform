# NewMind AI Platform - 配置清单
# 版本: 1.0

# 系统依赖
system:
  python:
    file: "installers/system/python-3.11.7-macos11.pkg"
    version: "3.11.7"
    description: "独立Python解释器，不依赖系统Python"
  docker:
    file: "installers/Docker.dmg"
    version: "latest"
  nodejs:
    file: "installers/system/node-v22.20.0.pkg"
    version: "22.20.0"
  uv:
    file: "installers/system/uv-installer.sh"
    version: "latest"

# 应用程序
applications:
  lmstudio:
    file: "installers/LM-Studio-0.3.32-2-arm64.dmg"
    version: "0.3.32-2"
    install_path: "/Applications/LM Studio.app"
  newchat:
    file: "installers/NewChat-1.1.0-mac-arm64.dmg"
    version: "1.1.0"
    install_path: "/Applications/NewChat.app"

# Docker镜像
docker_images:
  elasticsearch:
    file: "installers/docker_images/elasticsearch-8.17.3.tar"
    image: "docker.elastic.co/elasticsearch/elasticsearch:8.17.3"
    version: "8.17.3"
  kibana:
    file: "installers/docker_images/kibana-8.17.3.tar"
    image: "docker.elastic.co/kibana/kibana:8.17.3"
    version: "8.17.3"
  logstash:
    file: "installers/docker_images/logstash-8.17.3.tar"
    image: "docker.elastic.co/logstash/logstash:8.17.3"
    version: "8.17.3"
  newflow_docs:
    file: "installers/newflow-docs-1.0.tar"
    image: "newflow-docs:1.0"
    version: "1.0"
  newchat_docs:
    file: "installers/newchat-docs-1.0.1.tar"
    image: "newchat-docs:1.0.1"
    version: "1.0.1"
  mcp_elasticsearch:
    file: "installers/newmind-mcp-elasticsearch-1.0.0.tar"
    image: "newmind-mcp-elasticsearch:1.0.0"
    version: "1.0.0"
  mcp_kibana:
    file: "installers/newmind-mcp-kibana-1.0.0.tar"
    image: "newmind-mcp-kibana:1.0.0"
    version: "1.0.0"
  mcp_newflow:
    file: "installers/newmind-mcp-newflow-1.0.0.tar"
    image: "newmind-mcp-newflow:1.0.0"
    version: "1.0.0"
  minio:
    file: "installers/docker_images/minio-latest.tar"
    image: "minio/minio:latest"
    version: "latest"

# 本地模块 (非Docker)
local_modules:
  newrag:
    file: "installers/newrag-main-1.1.0.zip"
    version: "1.1.0"
    description: "RAG 知识库系统 (Frontend + Backend + MCP)"
    install_path: "newrag-main"
  newflow:
    file: "installers/newflow-main-1.0.0.zip"
    version: "1.0.0"
    description: "NewFlow 工作流引擎 (Node.js)"
    install_path: "newflow-main"

# AI模型（需手动下载）
ai_models:
  base_path: "installers/models"
  runtime_path: "~/.lmstudio/models"
  models: []  # 不再预置模型，请使用 LM Studio 手动下载
    # - name: "Qwen3-VL-30B"
    #   path: "installers/models/qwen3-vl-30b"
    #   size: "30GB"
    #   description: "用于多模态视觉理解和代码生成"
    # - name: "Qwen3-Next-80B"
    #   path: "installers/models/qwen3-next-80b"
    #   size: "42GB"
    #   description: "用于通用对话、逻辑推理和复杂任务"
    # - name: "text-embedding-qwen3-embedding-4b"
    #   type: "embedding"
    #   size: "4GB"
    #   description: "用于 RAG 知识库向量化"

# Python依赖
python:
  requirements: "installers/python_deps/requirements.txt"
  wheels: "installers/python_deps/wheels/"
  venv_path: "python_dashboard/.venv"

# 数据目录
data:
  elasticsearch: "elasticsearch/node*"
  newflow: "newflow_data/"
  minio: "minio_data/"
  mcp: "python_dashboard/mcp_instances.db"
  logs: "logs/"
  dashboard_logs: "python_dashboard/*.log"

# 端口配置
ports:
  dashboard: 8000
  elasticsearch: 9200
  kibana: 5601
  newflow: 5678
  lmstudio: 1234
  newchat: 61990
  minio_api: 9000
  minio_console: 9001
  mcp_elasticsearch: 3005
  mcp_kibana: 3002
  mcp_newflow: 3003

# 临时文件（可安全删除）
temporary_files:
  - ".install_state"
  - "logs/*.log"
  - "python_dashboard/dashboard.pid"
  - "python_dashboard/dashboard.log"
  - "python_dashboard/mcp_logs/*"
  - "python_dashboard/mcp_pids/*"
  - "python_dashboard/.venv"
  - "newflow_data/*.sqlite*"
  - "newflow_data/*.log"
  - "elasticsearch/node*/*"

# 下载源配置
