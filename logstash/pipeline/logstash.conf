# Logstash Pipeline配置

input {
  beats {
    port => 5044
  }
}

filter {
  # 添加时间戳
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://es01:9200"]
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "logstash-%{+YYYY.MM.dd}"
  }
  
  # 调试输出（可选）
  # stdout { codec => rubydebug }
}

